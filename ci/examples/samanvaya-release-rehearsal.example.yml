# Install as .github/workflows/samanvaya-release-rehearsal.yml after review.
name: Samanvaya multi-PR release rehearsal

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Samanvaya release ID
        type: string
        required: true
      revision:
        description: Exact target commit recorded in the release manifest
        type: string
        required: true
      artifact_id:
        description: ID of the approved GitHub Actions artifact
        type: string
        required: true
      artifact_digest:
        description: SHA-256 digest of the approved artifact archive without a prefix
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  rehearse:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the approved gate implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/samanvaya-release-gate
      - name: Fetch and verify the exact artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        run: |
          test "$GITHUB_SERVER_URL" = "https://github.com"
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/samanvaya-candidate.zip"
          timeout 90 gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > "$archive"
          printf '%s  %s\n' "$CANDIDATE_ARTIFACT_DIGEST" "$archive" | sha256sum --check --strict --status
      - name: Check approval for the complete candidate
        uses: ./.github/actions/samanvaya-release-gate
        with:
          api-url: ${{ vars.SAMANVAYA_API_URL }}
          project-id: ${{ vars.SAMANVAYA_PROJECT_ID }}
          release-id: ${{ inputs.release_id }}
          revision: ${{ inputs.revision }}
          artifact-id: ${{ inputs.artifact_id }}
          artifact-digest: ${{ inputs.artifact_digest }}
          environment: production
          token: ${{ secrets.SAMANVAYA_RELEASE_GATE_TOKEN }}
      - name: Mark successful rehearsal
        run: |
          test -s "$RUNNER_TEMP/samanvaya-candidate.zip"
          echo 'Rehearsal marker reached after verifying the tested artifact and both approvals.' >> "$GITHUB_STEP_SUMMARY"
