# Install as .github/workflows/samanvaya-release-build.yml after review.
name: Samanvaya trusted release build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TASKFLOW_TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install TaskFlow test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run combined target tests
        working-directory: backend
        run: python -m pytest tests -q --junitxml=junit.xml
      - name: Publish the target test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: samanvaya-release-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/junit.xml
          if-no-files-found: error
      - name: Package the tested commit for the rehearsal
        run: git archive --format=tar --output=candidate.tar "$GITHUB_SHA"
      - name: Upload the candidate
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: samanvaya-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate.tar
          if-no-files-found: error
          retention-days: 14
      - name: Identify the release candidate
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          printf 'Build run ID: %s\nArtifact ID: %s\nArchive SHA-256: %s\nTarget: %s\n' \
            "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
