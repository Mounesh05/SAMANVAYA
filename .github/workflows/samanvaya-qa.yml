name: Samanvaya QA

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Language runtime setup with caching
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
      
      - uses: actions/setup-node@v4
        if: hashFiles('package.json', 'frontend/package.json') != ''
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      
      # Install dependencies
      - name: Install dependencies
        run: |
          # Python dependencies
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      
      # Run tests with multi-language detection
      - name: Install pinned static-analysis parser
        run: npm ci --prefix backend/benchmark_worker --ignore-scripts --no-audit --no-fund

      - name: Run tests
        shell: bash
        run: bash ci/run_tests.sh
      
      # Static analysis
      - name: Check runtime names and syntax with Ruff
        if: always()
        run: cd backend && ruff check . --select F821,E9 --exclude .venv

      - name: Lint with Ruff
        if: always()
        continue-on-error: true
        run: |
          if [ -d backend ]; then
            cd backend && ruff check .
          fi
      
      - name: Type check with Mypy
        if: always()
        continue-on-error: true
        run: |
          if [ -d backend ]; then
            cd backend && mypy .
          fi
      
      - name: Security scan with Bandit
        if: always()
        continue-on-error: true
        run: |
          if [ -d backend ]; then
            cd backend && bandit -r . -ll
          fi
      
      - name: Dependency security audit
        if: always()
        run: |
          if [ -f backend/requirements.txt ]; then
            pip-audit
          fi
      
      # Upload results to Samanvaya
      - name: Upload results to Samanvaya
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SAMANVAYA_API_URL: ${{ secrets.SAMANVAYA_API_URL }}
          SAMANVAYA_PROJECT_ID: ${{ secrets.SAMANVAYA_PROJECT_ID }}
          SAMANVAYA_TEST_RESULTS_TOKEN: ${{ secrets.SAMANVAYA_TEST_RESULTS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ ! -f test-results-manifest.tsv ]; then
            echo "No test results manifest found"
            exit 0
          fi
          
          echo "Uploading test results from manifest..."
          while IFS=$'\t' read -r suite report exit_code; do
            if [ -f "$report" ]; then
              echo "Uploading $suite results from $report (exit code: $exit_code)"
              SAMANVAYA_TEST_SUITE="$suite" \
              CI_TEST_EXIT_CODE="$exit_code" \
              python ci/upload_junit_results.py --junit "$report" || echo "Upload failed for $suite"
            else
              echo "Warning: Report file $report not found for suite $suite"
            fi
          done < test-results-manifest.tsv
      
      # Fail workflow if tests failed
      - name: Fail workflow when tests fail
        if: always()
        run: exit "${TEST_EXIT_CODE:-0}"
