name: Samanvaya CI / QA

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      SAMANVAYA_API_URL: ${{ secrets.SAMANVAYA_API_URL }}
      SAMANVAYA_PROJECT_ID: ${{ secrets.SAMANVAYA_PROJECT_ID }}
      SAMANVAYA_TEST_RESULTS_TOKEN: ${{ secrets.SAMANVAYA_TEST_RESULTS_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q --junitxml=../test-results-backend.xml
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-backend.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload results to Samanvaya
        if: always() && github.event_name != 'pull_request' && env.SAMANVAYA_API_URL != '' && env.SAMANVAYA_PROJECT_ID != '' && env.SAMANVAYA_TEST_RESULTS_TOKEN != ''
        working-directory: .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
          SAMANVAYA_TEST_SUITE: backend
        run: python ci/upload_junit_results.py --junit test-results-backend.xml
      - name: Explain skipped Samanvaya upload
        if: always() && github.event_name != 'pull_request' && (env.SAMANVAYA_API_URL == '' || env.SAMANVAYA_PROJECT_ID == '' || env.SAMANVAYA_TEST_RESULTS_TOKEN == '')
        run: echo "Skipping optional Samanvaya upload because one or more repository secrets are not configured."

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  docker-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file .env.example config --quiet
